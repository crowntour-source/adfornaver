<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원페이지 광고 한글화 도구</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>원페이지 광고 한글화</h1>
  <nav>
    <button class="tab active" data-tab="page">① 페이지 한글화</button>
    <button class="tab" data-tab="video">② 영상 한글화</button>
  </nav>
</header>

<main id="tab-page" class="pane">
  <form id="pageForm" class="bar">
    <input id="pageUrl" type="url" placeholder="영문 원페이지 광고 URL (https://…)" required>
    <input id="tone" placeholder="말투 (예: 친근한 존댓말)">
    <button id="pageGo" type="submit">한글로 변환</button>
    <details class="more">
      <summary>옵션</summary>
      <label><input type="checkbox" id="render"> 브라우저로 렌더링(JS로 그려지는 페이지)</label>
      <label><input type="checkbox" id="keepScripts"> 원본 스크립트 유지(번역이 덮어써질 수 있음)</label>
      <textarea id="glossary" rows="3" placeholder="용어집: 한 줄에 하나씩  예)  Crown Tour = 크라운투어"></textarea>
    </details>
  </form>
  <div id="pageStatus" class="status"></div>
  <div id="pageWork" class="split" hidden>
    <section class="preview">
      <div class="toolbar">
        <label><input type="checkbox" id="editMode" checked> 화면에서 직접 편집(문구 클릭 · 이미지 클릭=교체)</label>
        <select id="viewW"><option value="100%">PC</option><option value="390px">모바일</option></select>
        <button id="showOrig" type="button">원문/한글 전환</button>
        <button id="dlHtml" type="button" class="primary">HTML 다운로드</button>
      </div>
      <iframe id="frame" sandbox="allow-same-origin"></iframe>
    </section>
    <aside class="list">
      <input id="filter" placeholder="문구 검색">
      <div id="videoBox"></div>
      <div id="segList"></div>
    </aside>
  </div>
  <input type="file" id="imgPick" accept="image/*" hidden>
</main>

<main id="tab-video" class="pane" hidden>
  <form id="videoForm" class="bar">
    <input id="videoUrl" placeholder="영상 URL (mp4 직접 링크 / YouTube 등은 yt-dlp 필요)">
    <input id="videoFile" type="file" accept="video/*">
    <label><input type="checkbox" id="optStt" checked> 음성 인식·번역</label>
    <label><input type="checkbox" id="optOcr" checked> 화면 속 영어 텍스트</label>
    <button id="videoGo" type="submit">분석 시작</button>
  </form>
  <div id="videoStatus" class="status"></div>
  <div id="videoWork" hidden>
    <div class="split">
      <section class="preview">
        <video id="srcVideo" controls></video>
        <div class="opts">
          <label><input type="checkbox" id="optDub" checked> 한글 더빙(TTS)</label>
          <label>원음 볼륨
            <select id="optBg"><option value="0">끄기</option><option value="0.08" selected>8%</option><option value="0.2">20%</option><option value="1">100%</option></select></label>
          <label><input type="checkbox" id="optSub"> 한글 자막 넣기</label>
          <label>목소리
            <select id="optVoice"><option>nova</option><option>shimmer</option><option>alloy</option><option>onyx</option><option>echo</option></select></label>
        </div>
        <div class="toolbar">
          <button id="dlSrt" type="button">SRT 다운로드</button>
          <button id="renderGo" type="button" class="primary">한글 영상 만들기</button>
        </div>
        <div id="renderStatus" class="status"></div>
        <video id="outVideo" controls hidden></video>
        <a id="outLink" hidden class="primary btn">완성 영상 다운로드</a>
      </section>
      <aside class="list">
        <h3>내레이션 (더빙·자막)</h3>
        <div id="segTable"></div><button id="addSeg" type="button">+ 구간 추가</button>
        <h3>화면 속 텍스트 교체</h3>
        <p class="hint">위치·크기는 영상 대비 %입니다. 영상을 원하는 시점에 멈추고 값을 맞추세요.</p>
        <div id="ovTable"></div><button id="addOv" type="button">+ 텍스트 추가</button>
      </aside>
    </div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
