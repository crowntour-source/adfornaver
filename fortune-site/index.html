<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K-Name & K-Match</title>
<meta name="description" content="Get a fun Korean name and K-match compatibility. English, 한국어, ไทย, Tiếng Việt, Bahasa Indonesia, 中文, Français, Español.">
<!--BUILD:HEAD-->
<link rel="canonical" href="https://example.com/">
<meta property="og:type" content="website">
<meta property="og:title" content="K-Name &amp; K-Match: Fun Korean names and K-style compatibility for fans of Korea">
<meta property="og:description" content="Get a fun Korean name with its meaning and check your K-Match. Share the card on Instagram and Facebook.">
<meta property="og:url" content="https://example.com/">
<meta property="og:image" content="https://example.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<!--BUILD:END-->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="t-title"></h1>
      <p class="sub" id="t-sub"></p>
    </div>
    <nav class="langs" id="langs" aria-label="Language"></nav>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-match" aria-selected="true" aria-controls="panel-match"></button>
    <button role="tab" id="tab-name" aria-selected="false" aria-controls="panel-name"></button>
  </div>

  <section id="panel-match" class="card" role="tabpanel">
    <form id="form-match" novalidate>
      <div class="grid">
        <fieldset>
          <legend id="t-pa"></legend>
          <label for="nameA" data-t="name"></label><input id="nameA" maxlength="40" autocomplete="off"><button type="button" class="mic" data-mic="nameA" hidden>🎤 <span data-t="mic"></span></button>
          <label for="birthA" data-t="birth"></label><input id="birthA" type="date" min="1900-01-01" required>
        </fieldset>
        <fieldset>
          <legend id="t-pb"></legend>
          <label for="nameB" data-t="name"></label><input id="nameB" maxlength="40" autocomplete="off"><button type="button" class="mic" data-mic="nameB" hidden>🎤 <span data-t="mic"></span></button>
          <label for="birthB" data-t="birth"></label><input id="birthB" type="date" min="1900-01-01" required>
        </fieldset>
      </div>
      <button class="go" type="submit" id="t-calc"></button>
      <p class="err" id="err-match" role="alert"></p>
    </form>
    <div id="out-match" hidden></div>
    <div id="share-match" class="share" hidden></div>
  </section>

  <section id="panel-name" class="card" role="tabpanel" hidden>
    <form id="form-name" novalidate>
      <div class="grid">
        <div>
          <label for="yourName" data-t="yourName"></label><input id="yourName" maxlength="40" autocomplete="off"><button type="button" class="mic" data-mic="yourName" hidden>🎤 <span data-t="mic"></span></button>
          <label for="surname" data-t="surname"></label><select id="surname"></select>
          <label for="gender" data-t="gender"></label>
          <select id="gender"><option value="u" data-t="gU"></option><option value="m" data-t="gM"></option><option value="f" data-t="gF"></option></select>
        </div>
        <div>
          <label for="vibe" data-t="vibe"></label>
          <select id="vibe">
            <option value="any" data-t="vAny"></option><option value="cute" data-t="vCute"></option>
            <option value="cool" data-t="vCool"></option><option value="elegant" data-t="vElegant"></option>
            <option value="bright" data-t="vBright"></option><option value="strong" data-t="vStrong"></option>
          </select>
          <label for="bdate" data-t="bdate"></label><input id="bdate" type="date" min="1900-01-01">
        </div>
      </div>
      <button class="go" type="submit" id="t-find"></button>
    </form>
    <div id="out-name" hidden></div>
    <div id="share-name" class="share" hidden></div>
  </section>

  <div class="ad-slot" data-slot="result"></div>

  <p class="note" id="t-disc"></p>
  <nav class="links" id="t-links" aria-label="Site"></nav>
  <footer id="t-foot"></footer>
</div>
<script src="data.js"></script>
<script src="lang/en.js"></script>
<script src="lang/ko.js"></script>
<script src="lang/th.js"></script>
<script src="lang/vi.js"></script>
<script src="lang/id.js"></script>
<script src="lang/zh.js"></script>
<script src="lang/fr.js"></script>
<script src="lang/es.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="share.js"></script>
<script src="voice.js"></script>
<script src="ui.js"></script>
<script src="ads.js" defer></script>
</body>
</html>
